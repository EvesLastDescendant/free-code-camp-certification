<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport"
	      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
	<meta http-equiv="X-UA-Compatible" content="ie=edge">

	<title>Real Time Character Counter</title>

	<link rel="stylesheet" href="style.css">

	<script src="script.js" defer></script>

<body>
	<h1>Real Time Character Counter</h1>
	<label for="text-input" hidden>Real Time Character Counter</label>
	<textarea name="text-input" id="text-input" cols="25" rows="5" placeholder="Type something..."></textarea>
	<p id="char-count">Character Count: 0/50</p>
</body>
