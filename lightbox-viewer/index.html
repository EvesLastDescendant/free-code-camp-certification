<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport"
	      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
	<meta http-equiv="X-UA-Compatible" content="ie=edge">
	<title>Lightbox Viewer</title>

	<link rel="stylesheet" href="./styles.css">

	<script src="./script.js" defer></script>

</head>
<body>
	<div class="gallery">
		<img 
			src="https://cdn.freecodecamp.org/curriculum/labs/stonehenge-thumbnail.jpg" 
			alt="stonehenge" 
			class="gallery-item" 
		/>
		<img 
			src="https://cdn.freecodecamp.org/curriculum/labs/storm-thumbnail.jpg" 
			alt="storm" 
			class="gallery-item" 
		/>
		<img 
			src="https://cdn.freecodecamp.org/curriculum/labs/trees-thumbnail.jpg" 
			alt="trees" 
			class="gallery-item" 
		/>
	</div>
	<div class="lightbox">
		<button id="close-btn">&times;</button>
		<img src="" alt="lightbox-image" id="lightbox-image">
	</div>
</body>
</html>
